description:
  en:
    shortDescription: |-
      This repository contains the source code and the technical documentation
      of the websites https://open.minvws.nl/ and https://open.minfin.nl/.
    features:
      - Publication of dossiers in multiple dossier types (Woo decisions,
        covenants, annual reports, investigation reports, dispositions,
        complaint judgements, advice, draft decisions and other publications)
      - Searching through dossiers with filters
      - Publication to open.overheid.nl via DiWoo sitemaps
      - Publication API (OpenAPI) for connecting source systems
      - Multi-tenant, with multiple organisations per tenant
      - Two-factor authentication, roles and audit logging
      - Virus scanning of uploaded documents
    longDescription: |
      [Open.minvws.nl](https://open.minvws.nl/) is the Open Government Act
      (Woo; Wet open overheid) publication platform of the Ministry of Health,
      Welfare, and Sport in the  Netherlands (Ministerie van Volksgezondheid,
      Welzijn en Sport; short:  MinVWS). The aim of the OpenMinVWS platform is
      to streamline the process for  government officials to publish documents,
      while also improving  accessibility for journalists and the public to
      search through these  documents.


      The Woo consists of [17
      categories](https://open.overheid.nl/documenten/fd3aaf98-ad83-4a15-a526-b0511f283bad/file)
      of documents that need to be made public. The platform supports
      publication of Woo decisions (category 14) and several other dossier
      types, such as covenants, annual reports, investigation reports,
      dispositions, complaint judgements and advice. Support for the remaining
      categories is added over time.

      The platform runs multi-tenant: each ministry has its own tenant, and
      within a tenant multiple organisations can publish.


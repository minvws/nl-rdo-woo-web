public.global.logo.text: "ministerie van Infrastructuur en Waterstaat"
public.department.description: "Op dit platform vindt u informatie die openbaar is gemaakt op grond van de Wet open overheid door het ministerie van Infrastructuur en Waterstaat en aan haar verwante (zelfstandig) bestuursorganen. Het platform zal de komende periode aangevuld worden met meer informatie."
public.browse.facets.description: "Op dit platform vindt u informatie die openbaar is gemaakt op grond van de <a href='https://www.rijksoverheid.nl/onderwerpen/wet-open-overheid-woo'>Wet open overheid (Woo)</a> door het ministerie van Infrastructuur en Waterstaat en aan haar verwante (zelfstandig) bestuursorganen. Het platform zal de komende periode aangevuld worden met meer informatie."

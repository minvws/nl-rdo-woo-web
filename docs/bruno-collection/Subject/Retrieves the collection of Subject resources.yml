info:
  name: Retrieves the collection of Subject resources.
  type: http
  seq: 1
  tags:
    - Subject

http:
  method: GET
  url: "{{baseUrl}}/organisation/:organisationId/subject"
  params:
    - name: cursor
      value: ""
      type: query
      disabled: true
    - name: organisationId
      value: "{{organisationId}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();
        const items = data.items;

        const subject = items.find(item => item.name === "E2E Test Subject");

        if (subject) {
          bru.setVar("subjectId", subject.id);
        } else if (items.length > 0) {
          console.warn('Set the first subject found instead of "E2E Test Subject"');
          bru.setVar("subjectId", items[0].id);
        } else {
          throw new Error("E2E Test Subject not found, variable could not be set");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true


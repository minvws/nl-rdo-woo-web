info:
  name: Replaces the AnnualReport resource.
  type: http
  seq: 3
  tags:
    - AnnualReport

http:
  method: PUT
  url: "{{baseUrl}}/organisation/:organisationId/dossiers/annual-report/external/:dossierExternalId"
  params:
    - name: organisationId
      value: "{{organisationId}}"
      type: path
    - name: dossierExternalId
      value: "{{annualReportDossierExternalId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "departmentId": "{{departmentId}}",
        "mainDocument": {
          "fileName": "main-document.pdf",
          "formalDate": "2026-02-01",
          "language": "NLD",
          "type": "c_3d782f30",
          "grounds": []
        },
        "subjectId": "{{subjectId}}",
        "summary": "Summary of the annual report",
        "title": "Bruno - Annual report",
        "attachments": [
          {
            "fileName": "attachment.pdf",
            "formalDate": "2026-02-01",
            "language": "NLD",
            "type": "c_d506b718",
            "externalId": "{{annualReportAttachmentExternalId}}",
            "grounds": []
          }
        ],
        "year": 2025,
        "dossierNumber": "bruno-{{sessionTimestamp}}",
        "publicationDate": "2026-02-01"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (bru.isSafeMode()) {
          throw new Error("Enable develop mode to support the scripts");
        }

        const crypto = require('crypto');

        if (!bru.getVar("annualReportDossierExternalId")) {
          bru.setVar("annualReportDossierExternalId", crypto.randomUUID());
        }
        if (!bru.getVar("annualReportAttachmentExternalId")) {
          bru.setVar("annualReportAttachmentExternalId", crypto.randomUUID());
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true


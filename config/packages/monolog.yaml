parameters:
    env(LOG_LEVEL): debug
    log_level: '%env(string:LOG_LEVEL)%'

monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    parameters:
        env(LOG_STDERR_LEVEL): notice

    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: '%log_level%'
                channels: ["!event", "!deprecation"]
            stderr:
                type: stream
                path: php://stderr
                level: '%env(string:LOG_STDERR_LEVEL)%'
                channels: ["!event", "!doctrine", "!deprecation"]
            deprecation:
                type: stream
                path: "%kernel.logs_dir%/deprecations.log"
                level: debug
                channels: [ deprecation ]
            # uncomment to log all queries that are executed by doctrine
            #doctrine:
            #    action_level: debug
            #    type: stream
            #    path: '%kernel.logs_dir%/%kernel.environment%_doctrine.log'
            #    channels: doctrine

            # uncomment to get logging in your browser
            # you may have to allow bigger header sizes in your Web server configuration
            #firephp:
            #    type: firephp
            #    level: info
            #chromephp:
            #    type: chromephp
            #    level: info
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    parameters:
        env(LOG_OUTPUT): syslog

    services:
        app.monolog.main_handler_locator:
            class: Symfony\Component\DependencyInjection\ServiceLocator
            arguments:
                - syslog: '@monolog.handler.syslog'
                  stderr: '@monolog.handler.stderr'
            tags: ['container.service_locator']

        app.monolog.main_handler:
            class: Monolog\Handler\HandlerInterface
            factory: ['@app.monolog.main_handler_locator', 'get']
            arguments: ['%env(LOG_OUTPUT)%']

    monolog:
        handlers:
            main:
                type: service
                id: app.monolog.main_handler
                channels: ["!doctrine", "!event", "!deprecation"]
            syslog:
                type: syslog
                ident: woopie
                formatter: monolog.formatter.json
                level: notice
                nested: true
            stderr:
                type: stream
                path: php://stderr
                formatter: monolog.formatter.json
                level: notice
                nested: true
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json

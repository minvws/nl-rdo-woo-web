framework:
    router:
        # Configure how to generate URLs in non-HTTP contexts, such as CLI commands.
        # See https://symfony.com/doc/current/routing.html#generating-urls-in-commands
        # Bound to the tenant's own public base url, so absolute urls generated from
        # commands and message handlers point at the right host per tenant.
        default_uri: '%public_base_url%'

when@prod:
    framework:
        router:
            strict_requirements: null

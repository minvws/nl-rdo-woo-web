name: Build PHP image

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: "The tag of the image to build"
        required: true

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build-image.yml
    with:
      image: php
      dockerfile: docker/php/Dockerfile
      image-tag: ${{ inputs.image-tag }}

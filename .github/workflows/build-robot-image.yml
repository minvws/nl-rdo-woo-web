name: Build Robot image

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      image-tag:
        description: "The version tag to use for the image (e.g., '2024.04.15'). If not provided, it defaults to the current year, month and week number in 'YYYY.MM.WW' format."
        required: false

jobs:
  setup:
    name: Determine version
    runs-on: ubuntu-26.04
    outputs:
      image-tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Generate tag
        id: tag
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          if [ -n "$IMAGE_TAG" ]; then
            echo "value=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(date -u +'%Y.%m.%V')" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: setup
    name: Build
    uses: ./.github/workflows/build-image.yml
    with:
      image: robot
      dockerfile: docker/robot/Dockerfile
      image-tag: ${{ needs.setup.outputs.image-tag }}

# Admin\Controller classes are picked up by the shared "controllers" import in
# config/routes.yaml, which loads every service carrying a #[Route] attribute.

api_platform:
    resource: .
    type: api_platform
    prefix: /balie/api

app_admin_accessibility:
    path:          /balie/toegankelijkheid
    controller:    Admin\Controller\IndexController::contentPage
    defaults:
        slug: 'toegankelijkheid'

app_admin_privacy:
    path:          /balie/privacy
    controller:    Admin\Controller\IndexController::contentPage
    defaults:
        slug: 'privacy'

app_admin_contact:
    path:          /balie/contact
    controller:    Admin\Controller\IndexController::contentPage
    defaults:
        slug: 'balie-contact'

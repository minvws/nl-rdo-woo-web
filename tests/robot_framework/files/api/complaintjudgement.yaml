baseline:
  skip: false
  tags: []
  request:
    body:
      departmentId: <ROBOT SELECT>
      dossierDate: <ROBOT DATE -1>
      dossierNumber: <ROBOT RANDOMIZE>
      publicationDate: <ROBOT DATE -1>
      subjectId: <ROBOT SELECT>
      summary: |
        Officer factor language reveal Mrs color space. Always conference themselves study over.
        Seem happen civil begin that out. Occur either couple parent appear operation hair simple.
      title: <ROBOT RANDOMIZE>
      mainDocument:
        fileName: dummy.txt
        formalDate: <ROBOT DATE -1>
        grounds: [<ROBOT RANDOMIZE>]
        language: NLD
        type: ww_jc6woe9
      attachments:
        - externalId: <PYTHON GUID>
          fileName: kranten artikel.txt
          formalDate: <ROBOT DATE -12>
          grounds: [<ROBOT RANDOMIZE>]
          language: NLD
          type: c_c2f56984
        - externalId: <PYTHON GUID>
          fileName: bijbehorende vergunning.txt
          formalDate: <ROBOT DATE -25>
          grounds: [<ROBOT RANDOMIZE>]
          language: NLD
          type: c_002fc258
    files:
      mainDocument:
        file: files/dummy.txt
        expected_response_status: 204
      attachments:
        - externalId: <PYTHON GUID>
          file: files/dummy.txt
          expected_response_status: 204
        - externalId: <PYTHON GUID>
          file: files/dummy.txt
          expected_response_status: 204
    expected_response_status: 200
    expected_publication_status: published

testcases:
- title: Happy flow
  steps:
    - name: Create dossier
      request: {}

- title: Create without uploading main document
  steps:
    - name: Create dossier
      request:
        files:
          mainDocument:
        expected_publication_status: concept

- title: Create without attachments and without uploading a main document
  steps:
    - name: Create dossier
      request:
        body:
          attachments: []
        files:
          attachments: []
          mainDocument:
        expected_publication_status: concept

- title: Upload the exact same request twice
  steps:
    - name: Create dossier
      request:
        files:
          mainDocument:
          attachments: []
          documents: []
        expected_publication_status: concept
    - name: Create dossier again with identical request
      reuse_previous_request: true
      request:
        files:
          mainDocument:
          attachments: []
        expected_publication_status: concept

- title: HAL links should be reachable
  steps:
    - name: Create dossier
      request: {}
    - name: Verify HAL links
      keyword:
        name: Verify HAL Links Are Reachable

- title: Excel main document is shown as table on public
  steps:
    - name: Create dossier with Excel main document
      request:
        body:
          mainDocument:
            fileName: klachtoordelen.xlsx
        files:
          mainDocument:
            file: files/spreadsheetpreview/klachtoordelen.xlsx
            expected_response_status: 204
    - name: Verify table on public
      keyword:
        name: Main Document Spreadsheet Preview Should Show Column
        args: [complaint-judgement, Naam]
    - name: Verify original file is still downloadable
      keyword:
        name: Main Document Download Should Match File
        args: [complaint-judgement, files/spreadsheetpreview/klachtoordelen.xlsx]

- title: Replacing Excel main document regenerates table on public
  steps:
    - name: Create dossier with Excel main document
      request:
        body:
          mainDocument:
            fileName: klachtoordelen.xlsx
        files:
          mainDocument:
            file: files/spreadsheetpreview/klachtoordelen.xlsx
            expected_response_status: 204
    - name: Verify table on public
      keyword:
        name: Main Document Spreadsheet Preview Should Show Column
        args: [complaint-judgement, Naam]
    - name: Replace main document
      keyword:
        name: Replace Main Document
        args: [complaint-judgement, files/spreadsheetpreview/klachtoordelen-gewijzigd.xlsx]
    - name: Verify regenerated table on public
      keyword:
        name: Main Document Spreadsheet Preview Should Show Column
        args: [complaint-judgement, Kenmerk]
    - name: Verify replaced file is downloadable
      keyword:
        name: Main Document Download Should Match File
        args: [complaint-judgement, files/spreadsheetpreview/klachtoordelen-gewijzigd.xlsx]

- title: Excel main document with multiple worksheets is rejected
  steps:
    - name: Create dossier without uploading main document
      request:
        body:
          mainDocument:
            fileName: meerdere-werkbladen.xlsx
        files:
          mainDocument:
        expected_publication_status: concept
    - name: Upload Excel with multiple worksheets
      keyword:
        name: Main Document Upload Should Be Rejected
        args: [complaint-judgement, files/spreadsheetpreview/meerdere-werkbladen.xlsx, spreadsheet contains multiple worksheets]

- title: Excel main document without header row is rejected
  steps:
    - name: Create dossier without uploading main document
      request:
        body:
          mainDocument:
            fileName: zonder-header.xlsx
        files:
          mainDocument:
        expected_publication_status: concept
    - name: Upload Excel without header row
      keyword:
        name: Main Document Upload Should Be Rejected
        args: [complaint-judgement, files/spreadsheetpreview/zonder-header.xlsx, first worksheet does not contain a header row]

baseline:
  skip: false
  tags: []
  request:
    body:
      departmentId: <ROBOT SELECT>
      dossierNumber: <ROBOT RANDOMIZE>
      dossierDate: <ROBOT DATE -1>
      publicationDate: <ROBOT DATE -1>
      subjectId: <ROBOT SELECT>
      summary: |
        This is a disposition document.
        It contains important decision information.
      title: <ROBOT RANDOMIZE>
      mainDocument:
        fileName: dummy.txt
        formalDate: <ROBOT DATE -1>
        grounds: [<ROBOT RANDOMIZE>]
        language: NLD
        type: c_2ab17960
      attachments:
        - externalId: <PYTHON GUID>
          fileName: attachment.txt
          formalDate: <ROBOT DATE -1>
          grounds: [<ROBOT RANDOMIZE>]
          language: NLD
          type: c_03c52ba0
    files:
      mainDocument:
        file: files/dummy.txt
        expected_response_status: 204
      attachments:
        - externalId: <PYTHON GUID>
          file: files/dummy.txt
          expected_response_status: 204
    expected_response_status: 200
    expected_publication_status: published

testcases:
- title: Happy flow
  steps:
    - name: Create disposition
      request: {}

- title: Create without attachments
  steps:
    - name: Create disposition
      request:
        body:
          attachments: []
        files:
          attachments: []

- title: Create without uploading a main document
  steps:
    - name: Create disposition
      request:
        files:
          mainDocument:
        expected_publication_status: concept

- title: Create without attachments and without uploading a main document
  steps:
    - name: Create disposition
      request:
        body:
          attachments: []
        files:
          attachments: []
          mainDocument:
        expected_publication_status: concept

- title: Upload the exact same request twice
  steps:
    - name: Create dossier
      request:
        files:
          mainDocument:
          attachments: []
          documents: []
        expected_publication_status: concept
    - name: Create dossier again with identical request
      reuse_previous_request: true
      request:
        files:
          mainDocument:
          attachments: []
        expected_publication_status: concept

- title: HAL links should be reachable
  steps:
    - name: Create dossier
      request: {}
    - name: Verify HAL links
      keyword:
        name: Verify HAL Links Are Reachable

- title: Excel main document is shown as table on public
  steps:
    - name: Create dossier with Excel main document
      request:
        body:
          mainDocument:
            fileName: klachtoordelen.xlsx
        files:
          mainDocument:
            file: files/spreadsheetpreview/klachtoordelen.xlsx
            expected_response_status: 204
    - name: Verify table on public
      keyword:
        name: Main Document Spreadsheet Preview Should Show Column
        args: [disposition, Naam]
    - name: Verify original file is still downloadable
      keyword:
        name: Main Document Download Should Match File
        args: [disposition, files/spreadsheetpreview/klachtoordelen.xlsx]

- title: Replacing Excel main document regenerates table on public
  steps:
    - name: Create dossier with Excel main document
      request:
        body:
          mainDocument:
            fileName: klachtoordelen.xlsx
        files:
          mainDocument:
            file: files/spreadsheetpreview/klachtoordelen.xlsx
            expected_response_status: 204
    - name: Verify table on public
      keyword:
        name: Main Document Spreadsheet Preview Should Show Column
        args: [disposition, Naam]
    - name: Replace main document
      keyword:
        name: Replace Main Document
        args: [disposition, files/spreadsheetpreview/klachtoordelen-gewijzigd.xlsx]
    - name: Verify regenerated table on public
      keyword:
        name: Main Document Spreadsheet Preview Should Show Column
        args: [disposition, Kenmerk]
    - name: Verify replaced file is downloadable
      keyword:
        name: Main Document Download Should Match File
        args: [disposition, files/spreadsheetpreview/klachtoordelen-gewijzigd.xlsx]

- title: Excel main document with multiple worksheets is rejected
  steps:
    - name: Create dossier without uploading main document
      request:
        body:
          mainDocument:
            fileName: meerdere-werkbladen.xlsx
        files:
          mainDocument:
        expected_publication_status: concept
    - name: Upload Excel with multiple worksheets
      keyword:
        name: Main Document Upload Should Be Rejected
        args: [disposition, files/spreadsheetpreview/meerdere-werkbladen.xlsx, spreadsheet contains multiple worksheets]

- title: Excel main document without header row is rejected
  steps:
    - name: Create dossier without uploading main document
      request:
        body:
          mainDocument:
            fileName: zonder-header.xlsx
        files:
          mainDocument:
        expected_publication_status: concept
    - name: Upload Excel without header row
      keyword:
        name: Main Document Upload Should Be Rejected
        args: [disposition, files/spreadsheetpreview/zonder-header.xlsx, first worksheet does not contain a header row]

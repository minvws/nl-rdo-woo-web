baseline:
  skip: false
  tags: []
  request:
    body:
      departmentId: <ROBOT SELECT>
      dossierNumber: <ROBOT RANDOMIZE>
      dossierDate: <ROBOT DATE -1>
      publicationDate: <ROBOT DATE -1>
      subjectId: <ROBOT SELECT>
      summary: |
        This is a draft decision document.
        It contains important legislative proposal information.
      title: <ROBOT RANDOMIZE>
      mainDocument:
        fileName: dummy.txt
        formalDate: <ROBOT DATE -1>
        language: NLD
        type: c_33d7570c
      attachments:
        - externalId: <PYTHON GUID>
          fileName: dummy.txt
          formalDate: <ROBOT DATE -1>
          language: NLD
          type: c_a40458df
    files:
      mainDocument:
        file: files/dummy.txt
        expected_response_status: 204
      attachments:
        - externalId: <PYTHON GUID>
          file: files/dummy.txt
          expected_response_status: 204
    expected_response_status: 200
    expected_publication_status: published

testcases:
- title: Happy flow
  steps:
    - name: Create dossier
      request: {}

- title: Happy flow with policy document as required attachment
  steps:
    - name: Create dossier
      request:
        body:
          attachments:
            - externalId: <PYTHON GUID>
              fileName: dummy.txt
              formalDate: <ROBOT DATE -1>
              language: NLD
              type: c_10eb451d
        files:
          attachments:
            - externalId: <PYTHON GUID>
              file: files/dummy.txt
              expected_response_status: 204

- title: Create with multiple attachments
  steps:
    - name: Create dossier
      request:
        body:
          attachments:
            - externalId: <PYTHON GUID>
              fileName: dummy.txt
              formalDate: <ROBOT DATE -1>
              language: NLD
              type: c_a40458df
            - externalId: <PYTHON GUID>
              fileName: dummy.txt
              formalDate: <ROBOT DATE -2>
              language: NLD
              type: c_03c52ba0
        files:
          attachments:
            - externalId: <PYTHON GUID>
              file: files/dummy.txt
              expected_response_status: 204
            - externalId: <PYTHON GUID>
              file: files/dummy.txt
              expected_response_status: 204

- title: Create without uploading a main document
  steps:
    - name: Create dossier
      request:
        files:
          mainDocument:
        expected_publication_status: concept

- title: Create without attachments
  steps:
    - name: Create dossier
      request:
        body:
          attachments: []
        files:
          attachments: []
        expected_response_status: 422

- title: Create without attachments and without uploading a main document
  steps:
    - name: Create dossier
      request:
        body:
          attachments: []
        files:
          attachments: []
          mainDocument:
        expected_response_status: 422

- title: Missing required field dossierDate
  steps:
    - name: Create dossier
      request:
        body:
          dossierDate:
        expected_response_status: 422

- title: Invalid main document type
  steps:
    - name: Create dossier
      request:
        body:
          mainDocument:
            fileName: dummy.txt
            formalDate: <ROBOT DATE -1>
            language: NLD
            type: c_a40458df
        expected_response_status: 422

- title: Upload the exact same request twice
  steps:
    - name: Create dossier
      request:
        files:
          mainDocument:
          attachments: []
        expected_publication_status: concept
    - name: Create dossier again with identical request
      reuse_previous_request: true
      request:
        files:
          mainDocument:
          attachments: []
        expected_publication_status: concept

- title: HAL links should be reachable
  steps:
    - name: Create dossier
      request: {}
    - name: Verify HAL links
      keyword:
        name: Verify HAL Links Are Reachable

baseline:
  skip: false
  request:
    body:
      departmentId: <ROBOT SELECT>
      dossierDate: <ROBOT DATE -14>
      dossierNumber: <ROBOT RANDOMIZE>
      publicationDate: <ROBOT DATE -1>
      subjectId: <ROBOT SELECT>
      summary: |
        Officer factor language reveal Mrs color space. Always conference themselves study over.
        Seem happen civil begin that out. Occur either couple parent appear operation hair simple.
      title: <ROBOT RANDOMIZE>
      mainDocument: ~
      noticeNotPublic:
        formalDate: <ROBOT DATE -14>
        documentName: Test notice document
        grounds: [<ROBOT RANDOMIZE>]
        explanation: Test explanation for notice not public
      attachments: []
    files:
      mainDocument: ~
      attachments: []
    expected_response_status: 200
    expected_publication_status: published

testcases:
- title: Happy flow
  steps:
    - name: Create dossier
      request: {}

- title: Create with both mainDocument and noticeNotPublic should fail
  steps:
    - name: Create dossier
      request:
        body:
          mainDocument:
            fileName: dummy.txt
            formalDate: <ROBOT DATE -1>
            grounds: [5.1.1a]
            language: NLD
            type: c_d506b718
          noticeNotPublic:
            formalDate: <ROBOT DATE -14>
            grounds: [5.1.1a]
        expected_response_status: 422

- title: Create with neither mainDocument nor noticeNotPublic should fail
  steps:
    - name: Create dossier
      request:
        body:
          mainDocument: ~
          noticeNotPublic: ~
        expected_response_status: 422

- title: Create with noticeNotPublic with empty grounds should fail
  steps:
    - name: Create dossier
      request:
        body:
          noticeNotPublic:
            formalDate: <ROBOT DATE -14>
            documentName: ~
            grounds: []
            explanation: ~
        expected_response_status: 422

- title: Create with noticeNotPublic missing formalDate should fail
  steps:
    - name: Create dossier
      request:
        body:
          noticeNotPublic:
            formalDate: ~
            grounds: [5.1.1a]
        expected_response_status: 422

- title: Create with noticeNotPublic with invalid grounds should fail
  steps:
    - name: Create dossier
      request:
        body:
          noticeNotPublic:
            formalDate: <ROBOT DATE -14>
            grounds: [not-a-valid-ground]
        expected_response_status: 422

- title: HAL links should be reachable
  steps:
    - name: Create dossier
      request: {}
    - name: Verify HAL links
      keyword:
        name: Verify HAL Links Are Reachable For Advice

- title: Upload the exact same request twice
  tags: [failing]
  steps:
    - name: Create dossier
      request: {}
    - name: Create dossier again with identical request
      reuse_previous_request: true
      request: {}

volumes:
  es_data:
    driver: local
  postgres_data:
    driver: local
  rustfs_data:
    driver: local
  woo_composer:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_woo_composer
  woo_pnpm:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_woo_pnpm

networks:
  woopie:
    driver: bridge

x-app-healthcheck: &app-healthcheck
  interval: 5s
  timeout: 15s
  retries: 20
  start_period: 30s

services:

  public:
    image: &PHP_IMAGE "ghcr.io/minvws/nl-rdo-woo-web-private/php:${PHP_IMAGE_TAG:-0.28.0}"
    user: ${FIXUID:-1000}:${FIXGID:-1000}
    labels:
      com.symfony.server.service-ignore: true
    volumes:
      - ./:/var/www/html
      - ./docker/php/files/usr/local/etc/php/conf.d/zzz-custom.ini:/usr/local/etc/php/conf.d/zzz-custom.ini
      - ./docker/php/files/usr/local/etc/php/conf.d/090-xdebug.ini:/usr/local/etc/php/conf.d/090-xdebug.ini
      - woo_composer:/home/woopie/.composer
      - woo_pnpm:/home/woopie/.local/share/pnpm/store
      - ./docker/php/files/etc/apache2/sites-available/public-woo.conf:/etc/apache2/sites-available/public-woo.conf
      - ./docker/php/files/etc/apache2/conf-available/public-woo-common.conf:/etc/apache2/conf-available/public-woo-common.conf
      - ./docker/php/files/etc/apache2/ports.conf:/etc/apache2/ports.conf
    networks:
      woopie:
        aliases:
          - public-minvws.local
          - public-minfin.local
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      APP_ID: PUBLIC
    ports:
      - ${DOCKER_MINVWS_PUBLIC_PORT:-8000}:80
      - ${DOCKER_MINFIN_PUBLIC_PORT:-8100}:81
    healthcheck:
      <<: *app-healthcheck
      test:
        - CMD-SHELL
        - >-
          for host in public-minvws.local public-minfin.local; do
          curl -fsS --max-time 5 -H "Host: $$host" http://localhost/health
          | grep -q '"healthy":true' || exit 1;
          done

  admin:
    image: *PHP_IMAGE
    user: ${FIXUID:-1000}:${FIXGID:-1000}
    labels:
      com.symfony.server.service-ignore: true
    volumes:
      - ./:/var/www/html
      - ./docker/php/files/usr/local/etc/php/conf.d/zzz-custom.ini:/usr/local/etc/php/conf.d/zzz-custom.ini
      - ./docker/php/files/usr/local/etc/php/conf.d/090-xdebug.ini:/usr/local/etc/php/conf.d/090-xdebug.ini
      - woo_composer:/home/woopie/.composer
      - woo_pnpm:/home/woopie/.local/share/pnpm/store
      - ./docker/php/files/etc/apache2/sites-available/admin-woo.conf:/etc/apache2/sites-available/admin-woo.conf
      - ./docker/php/files/etc/apache2/conf-available/admin-woo-common.conf:/etc/apache2/conf-available/admin-woo-common.conf
      - ./docker/php/files/etc/apache2/ports.conf:/etc/apache2/ports.conf
    networks:
      woopie:
        aliases:
          - admin-minvws.local
          - admin-minfin.local
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      APP_ID: ADMIN
    ports:
      - ${DOCKER_MINVWS_ADMIN_PORT:-8001}:80
      - ${DOCKER_MINFIN_ADMIN_PORT:-8101}:81
    healthcheck:
      <<: *app-healthcheck
      test:
        - CMD-SHELL
        - >-
          for host in admin-minvws.local admin-minfin.local; do
          curl -fsS --max-time 5 -H "Host: $$host" http://localhost/health
          | grep -q '"healthy":true' || exit 1;
          done

  publication_api:
    image: *PHP_IMAGE
    user: ${FIXUID:-1000}:${FIXGID:-1000}
    labels:
      com.symfony.server.service-ignore: true
    ports:
      - ${DOCKER_MINVWS_PUBLICATION_API_HTTPS_PORT:-8443}:443
      - ${DOCKER_MINFIN_PUBLICATION_API_HTTPS_PORT:-8444}:444
    volumes:
      - ./:/var/www/html
      - ./docker/php/files/usr/local/etc/php/conf.d/zzz-custom.ini:/usr/local/etc/php/conf.d/zzz-custom.ini
      - ./docker/php/files/usr/local/etc/php/conf.d/090-xdebug.ini:/usr/local/etc/php/conf.d/090-xdebug.ini
      - woo_composer:/home/woopie/.composer
      - woo_pnpm:/home/woopie/.local/share/pnpm/store
      - ./docker/php/files/etc/apache2/sites-available/publication_api-woo.conf:/etc/apache2/sites-available/publication_api-woo.conf
      - ./docker/certs/generated/server-bundle.pem:/etc/apache2/certs/server-bundle.pem:ro
      - ./docker/certs/generated/private/server.key.pem:/etc/apache2/certs/server.key.pem:ro
      - ./docker/certs/generated/client-bundle.pem:/etc/apache2/certs/client-bundle.pem:ro
      - ./docker/certs/generated/:/tmp/test-certs/:ro
    networks:
      woopie:
        aliases:
          - publication-api-minvws.local
          - publication-api-minfin.local
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      APP_ID: PUBLICATION_API

  worker_minvws:
    depends_on:
      - rabbitmq
    image: *PHP_IMAGE
    user: ${FIXUID:-1000}:${FIXGID:-1000}
    labels:
      com.symfony.server.service-ignore: true
    volumes:
      - ./:/var/www/html
      - ./docker/php/files/usr/local/etc/php/conf.d/zzz-custom.ini:/usr/local/etc/php/conf.d/zzz-custom.ini
      - ./docker/php/files/usr/local/etc/php/conf.d/090-xdebug.ini:/usr/local/etc/php/conf.d/090-xdebug.ini
    networks:
      - woopie
    environment:
      APP_ID: WORKER
    stop_signal: SIGINT
    restart: unless-stopped
    command:
      [
        "bash",
        "-c",
        "wait-for-it rabbitmq:5672 --timeout=0 --strict -- symfony run --watch=config,src,templates,vendor php -d memory_limit=-1 bin/console --tenant=minvws messenger:consume --memory-limit=1G -vv high esupdater ingestor global api_documents",
      ]

  worker_minfin:
    depends_on:
      - rabbitmq
    image: *PHP_IMAGE
    user: ${FIXUID:-1000}:${FIXGID:-1000}
    labels:
      com.symfony.server.service-ignore: true
    volumes:
      - ./:/var/www/html
      - ./docker/php/files/usr/local/etc/php/conf.d/zzz-custom.ini:/usr/local/etc/php/conf.d/zzz-custom.ini
      - ./docker/php/files/usr/local/etc/php/conf.d/090-xdebug.ini:/usr/local/etc/php/conf.d/090-xdebug.ini
    networks:
      - woopie
    environment:
      APP_ID: WORKER
    stop_signal: SIGINT
    restart: unless-stopped
    command:
      [
        "bash",
        "-c",
        "wait-for-it rabbitmq:5672 --timeout=0 --strict -- symfony run --watch=config,src,templates,vendor php -d memory_limit=-1 bin/console --tenant=minfin messenger:consume --memory-limit=1G -vv high esupdater ingestor global api_documents",
      ]

  tika:
    image: apache/tika:3.3.1.0
    labels:
      com.symfony.server.service-ignore: true
    networks:
      - woopie

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.29
    labels:
      com.symfony.server.service-ignore: true
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=true
      - http.cors.enabled=true
      - ELASTIC_PASSWORD=secret
      - http.cors.allow-origin=/localhost:9400|https:\/\/app\.elasticvue\.com/
      - http.cors.allow-credentials=true
      - http.cors.allow-headers=X-Requested-With,Content-Type,Content-Length,Authorization
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - ./docker/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
      - ./docker/elasticsearch/init:/init
    networks:
      - woopie
    ports:
      - ${DOCKER_ELASTICSEARCH_PORT:-9200}:9200

  redis:
    image: ghcr.io/minvws/keydb:6.3.4-multi
    labels:
      com.symfony.server.service-ignore: true
    networks:
      - woopie
    ports:
      - ${DOCKER_REDIS_PORT:-6379}:6379

  rabbitmq:
    image: rabbitmq:3-management
    labels:
      com.symfony.server.service-ignore: true
    networks:
      - woopie
    volumes:
      - ./docker/rabbitmq/10-definitions.conf:/etc/rabbitmq/conf.d/10-definitions.conf:ro
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - ${DOCKER_RABBITMQ_PORT:-5672}:5672
      - ${DOCKER_RABIITMQ_MANAGEMENT_PORT:-15672}:15672

  postgres:
    image: postgres:17.10-trixie
    labels:
      com.symfony.server.service-ignore: true
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - woopie
    command: ["postgres", "-c", "log_statement=all"]
    ports:
      - ${DOCKER_POSTGRES_PORT:-5432}:5432

  clamav:
    build:
      context: .
      dockerfile: docker/clamav/Dockerfile
    labels:
      com.symfony.server.service-ignore: true
    networks:
      - woopie

  rustfs:
    image: ghcr.io/rustfs/rustfs:1.0.0
    labels:
      com.symfony.server.service-ignore: true
    environment:
      RUSTFS_ACCESS_KEY: root
      RUSTFS_SECRET_KEY: password
    ports:
      - ${DOCKER_RUSTFS_PORT:-9000}:9000
      - ${DOCKER_RUSTFS_CONSOLE_PORT:-9001}:9001
    volumes:
      - rustfs_data:/data
    networks:
      - woopie
    healthcheck:
      <<: *app-healthcheck
      test: [CMD, curl, -fsS, http://localhost:9000/health]

  rclone:
    profiles: [run-only]
    image: rclone/rclone:1.75.1
    depends_on:
      rustfs:
        condition: service_healthy
    labels:
      com.symfony.server.service-ignore: true
    environment:
      RCLONE_CONFIG: /dev/null
      RCLONE_CONFIG_LOCAL_TYPE: s3
      RCLONE_CONFIG_LOCAL_PROVIDER: Other
      RCLONE_CONFIG_LOCAL_ENDPOINT: http://rustfs:9000
      RCLONE_CONFIG_LOCAL_ACCESS_KEY_ID: root
      RCLONE_CONFIG_LOCAL_SECRET_ACCESS_KEY: password
    networks:
      - woopie

  sphinx:
    user: ${FIXUID:-1000}:${FIXGID:-1000}
    profiles: [build-only]
    build:
      context: .
      dockerfile: docker/sphinx/Dockerfile
    labels:
      com.symfony.server.service-ignore: true
    volumes:
      - ./docs:/docs

  spectral:
    profiles: [api-linting]
    image: stoplight/spectral:6.16.3
    labels:
      com.symfony.server.service-ignore: true
    networks:
      - woopie
    volumes:
      - ./WOO-API-Rules.spectral.yml:/usr/src/spectral/.spectral.yml:ro
      - ./API-Design-Rules.spectral.yml:/usr/src/spectral/API-Design-Rules.spectral.yml:ro
      - ./public/api:/usr/src/spectral/api:ro

  certs:
    profiles: [build-only]
    build:
      context: .
      dockerfile: docker/certs/Dockerfile
      args:
        G4_TRIAL_VERSION: ${G4_TRAIL_VERSION:-v2.4}
    labels:
      com.symfony.server.service-ignore: true
    volumes:
      - ./docker/certs/config.yaml:/usr/src/g4-trial/config.yaml
      - ./docker/certs/enrollments:/usr/src/enrollments
      - ./docker/certs/scripts:/usr/src/scripts

  robot:
    profiles: [run-only]
    image: ghcr.io/minvws/nl-rdo-woo-web-private/robot:2026.06.25
    depends_on:
      public:
        condition: service_healthy
      admin:
        condition: service_healthy
    user: ${FIXUID:-1000}:${FIXGID:-1000}
    networks:
      - woopie
    volumes:
      - ./tests/robot_framework/tests:/home/pwuser/tests
      - ./tests/robot_framework/resources:/home/pwuser/resources
      - ./tests/robot_framework/libraries:/home/pwuser/libraries
      - ./tests/robot_framework/files:/home/pwuser/files
      - ./tests/robot_framework/results:/home/pwuser/results
      - ./tests/robot_framework/secrets:/home/pwuser/secrets
      - ./tests/robot_framework/envs:/home/pwuser/envs
      - ./tests/robot_framework/order.txt:/home/pwuser/order.txt
      - ./certs:/home/pwuser/certs

  schemathesis:
    profiles: [schemathesis]
    image: schemathesis/schemathesis:${SCHEMATHESIS_TAG:-4.21.8-trixie}
    networks:
      - woopie
    volumes:
      - ./certs/dev:/certs:ro
      - ./tests/schemathesis/reports:/reports

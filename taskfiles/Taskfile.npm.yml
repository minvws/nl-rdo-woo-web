# https://taskfile.dev
version: '3.50.0'

tasks:

  install:
    aliases: ["cmd:install"]
    desc: Install node dependencies
    cmds:
      - task: cmd:ci
        vars:
          SUB_CMD: "--no-fund"

  cmd:*:
    desc: Run a NPM command inside the admin service
    vars:
      NPM_CMD: '{{ index .MATCH 0 }}'
    cmds:
      - task: :dc:run:admin
        vars:
          SUB_CMD: 'npm {{ .NPM_CMD }} {{ .SUB_CMD }}'
          CLI_ARGS: '{{ .CLI_ARGS }}'

  script:*:
    desc: Run a NPM script
    vars:
      SCRIPT: '{{ index .MATCH 0 }}'
    cmds:
      - task: cmd:run
        vars:
          SUB_CMD: '{{ .SCRIPT }}'
          CLI_ARGS: '-- {{ .CLI_ARGS }}'

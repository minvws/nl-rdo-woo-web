# https://taskfile.dev
version: '3.50.0'

tasks:

  migrate:test:
    desc: Run (doctrine) database migrations in test environment
    cmds:
      - task: cmd:doctrine:database:create
        vars:
          TENANT: '{{ .TENANT }}'
          SUB_CMD: '--if-not-exists --no-interaction --env=test'
      - task: cmd:doctrine:schema:drop
        vars:
          TENANT: '{{ .TENANT }}'
          SUB_CMD: '--full-database --force --no-interaction --env=test'
      - task: cmd:doctrine:migrations:migrate
        vars:
          TENANT: '{{ .TENANT }}'
          SUB_CMD: '--no-interaction --env=test'
    requires:
      vars: [TENANT]

  migrate:diff:
    desc: Run (doctrine) database migrations diff
    cmds:
      - task: cmd:doctrine:migrations:diff
        vars:
          TENANT: 'minvws'
          SUB_CMD: '--no-interaction'

  migrate:dump:
    desc: Dump doctrine migrations to plain SQL files
    cmds:
      - task: cmd:woopie:sql:dump
        vars:
          TENANT: 'minvws'

  user:create:
    desc: Create an user
    vars:
      TENANT: '{{ .TENANT | default "minvws" }}'
    cmds:
      - task: cmd:woopie:user:create
        vars:
          TENANT: '{{ .TENANT }}'
          CLI_ARGS: '{{ .CLI_ARGS | default "\"email@example.org\" \"full name\" --super-admin" }}'

  migrate:
    desc: Run (doctrine) database migrations
    cmds:
      - task: cmd:doctrine:database:create
        vars:
          SUB_CMD: '--if-not-exists --no-interaction'
          TENANT: '{{ .TENANT }}'
      - task: cmd:doctrine:migrations:migrate
        vars:
          SUB_CMD: '--no-interaction'
          TENANT: '{{ .TENANT }}'
    requires:
      vars: [TENANT]

  loadfixtures:
    desc: Load doctrine example fixtures
    cmds:
      - task: cmd:doctrine:fixtures:load
        vars:
          SUB_CMD: '--no-interaction --append'
          TENANT: '{{ .TENANT }}'
    requires:
      vars: [TENANT]

  loaddemodata:
    desc: Clear all dossiers, documents and inquiries and load demo data. Use DOSSIERS=<0-100000> for another amount (default 95)
    aliases: [app:loaddemodata]
    prompt: >-
      This clears ALL dossiers, documents and inquiries of tenant "{{ .TENANT | default "minvws" }}", including the search index,
      the queues and the file storage, and loads the demo data. Continue?
    vars:
      TENANT: '{{ .TENANT | default "minvws" }}'
      DOSSIERS: '{{ .DOSSIERS | default "95" }}'
    preconditions:
      - sh: 'printf "%s" "{{ .DOSSIERS }}" | grep -Eq "^[0-9]{1,6}$" && [ "{{ .DOSSIERS }}" -le 100000 ]'
        msg: DOSSIERS must be a whole number between 0 and 100000
    cmds:
      # Busy workers would recreate the search index as a plain index while it is being replaced.
      - task: :dc
        vars:
          SUB_CMD: 'stop worker_{{ .TENANT }}'
      - defer:
          task: :dc
          vars:
            SUB_CMD: 'start worker_{{ .TENANT }}'
      - task: :cleansheet
        vars:
          TENANT: '{{ .TENANT }}'
          CLI_ARGS: '--keep-subjects'
      - task: :dc:exec:admin
        vars:
          SUB_CMD: 'env XDEBUG_MODE=off DEMO_DATA_DOSSIERS={{ .DOSSIERS }} php -d memory_limit=-1 bin/console --tenant={{ .TENANT }} --id=admin foundry:load-fixtures demo --append --no-interaction --no-debug --no-transaction'

  cmd:*:
    vars:
      CMD: '{{ index .MATCH 0 }}'
      ID: '{{ .ID | default "admin" }}'
    cmds:
      - task: :dc:exec:admin
        vars:
          SUB_CMD: 'bin/console --tenant={{ .TENANT }} --id={{ .ID }} {{ .CMD }} {{ .SUB_CMD }} {{ .CLI_ARGS }}'
          CLI_ARGS: '{{ .CLI_ARGS }}'
    requires:
      vars:
        - name: TENANT
          enum:
            ref: .LOCAL_TENANTS

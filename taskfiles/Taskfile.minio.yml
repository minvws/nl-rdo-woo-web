# https://taskfile.dev
version: '3.50.0'

vars:
  MINIO_ALIAS: local
  MINIO_BUCKETS:
    - doc-bucket
    - batch-bucket
    - woo-index-bucket
    - upload-bucket
    - assets-bucket

tasks:
  create-buckets:
    desc: Create the default buckets
    cmds:
      - task: :dc:exec:admin
        vars: { SUB_CMD: 'mc ready local' }
      - for:
          matrix:
            TENANT: { ref: .LOCAL_TENANTS }
            BUCKET: { ref: .MINIO_BUCKETS }
        task: :dc:exec:admin
        vars: { SUB_CMD: 'mc mb {{ .MINIO_ALIAS }}/{{ .ITEM.TENANT }}-{{ .ITEM.BUCKET }} --ignore-existing' }
    requires:
      vars: [LOCAL_TENANTS, MINIO_BUCKETS]

  clear-buckets:
    desc: Clear the default buckets
    cmds:
      - echo 'Clearing Minio buckets...'
      - for:
          matrix:
            TENANT: { ref: .LOCAL_TENANTS }
            BUCKET: { ref: .MINIO_BUCKETS }
        task: :dc:exec:admin
        vars: { SUB_CMD: 'mc rm {{ .MINIO_ALIAS }}/{{ .ITEM.TENANT }}-{{ .ITEM.BUCKET }} --recursive --force' }
      - echo 'Done clearing Minio buckets.'
    requires:
      vars: [LOCAL_TENANTS, MINIO_BUCKETS]

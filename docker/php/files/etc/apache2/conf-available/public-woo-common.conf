SetEnv APP_ID public

DocumentRoot /var/www/html/public
DirectoryIndex /index.php

SetEnvIf Host minfin DOC_TENANT=minfin
SetEnvIf Host minvws DOC_TENANT=minvws

RewriteEngine On

RewriteCond %{THE_REQUEST} \s/documentatie/(?:minfin|minvws)(?:[/?\s])
RewriteRule ^/documentatie/(?:minfin|minvws)(/.*)?$ /documentatie$1 [R=301,L]

RewriteCond %{REQUEST_URI} !^/documentatie/(minfin|minvws)(/|$)
RewriteRule ^/documentatie(/(.*))?$ /documentatie/%{ENV:DOC_TENANT}/$2 [L]

<Directory /var/www/html/public/documentatie>
    AllowOverride All
    Require all granted

    DirectoryIndex index.html
</Directory>

<Directory /var/www/html/public/api>
    AllowOverride All
    Require all granted

    DirectoryIndex index.html
</Directory>

<Directory /var/www/html/public>
    AllowOverride All
    Require all granted

    FallbackResource /index.php
</Directory>

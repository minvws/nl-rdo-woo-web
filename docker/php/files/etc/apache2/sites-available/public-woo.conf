<VirtualHost *:80>
    SetEnv DOC_TENANT minvws

    Include /etc/apache2/conf-available/public-woo-common.conf

    LogFormat "%{Host}i %h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" woo
    ErrorLog /var/log/apache2/public_error.log
    CustomLog /var/log/apache2/public_access.log woo
</VirtualHost>

<VirtualHost *:81>
    SetEnv DOC_TENANT minfin

    Include /etc/apache2/conf-available/public-woo-common.conf

    LogFormat "%{Host}i %h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" woo
    ErrorLog /var/log/apache2/public_error.log
    CustomLog /var/log/apache2/public_access.log woo
</VirtualHost>

<VirtualHost *:443 *:444>
    Include /etc/apache2/conf-available/publication_api-common.conf

    LogFormat "%{Host}i %h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" woo
    ErrorLog /var/log/apache2/publication_api_ssl_error.log
    CustomLog /var/log/apache2/publication_api_ssl_access.log woo
</VirtualHost>
